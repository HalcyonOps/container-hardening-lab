# tests/kyverno/kyverno-test.yaml
# Kyverno CLI test manifest — compatible with kyverno CLI v1.14+.
# Schema change from v1.13: results now use `resources: [name]` (array)
# instead of the deprecated `resource: name` (scalar).
#
# Run from repo root:
#   kyverno test tests/kyverno/

apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: container-hardening-lab-policy-tests

policies:
  - ../../policies/kyverno/no-root.yaml
  - ../../policies/kyverno/no-privileged.yaml

resources:
  - resources/pod-pass-hardened.yaml
  - resources/pod-fail-runasroot.yaml
  - resources/pod-fail-runasnonroot-false.yaml
  - resources/pod-fail-privilege-escalation.yaml
  - resources/pod-fail-privileged.yaml
  - resources/pod-fail-no-caps-drop.yaml
  - resources/pod-fail-hostpid.yaml
  - resources/pod-fail-hostipc.yaml
  - resources/pod-fail-hostnetwork.yaml

results:
  # -----------------------------------------------------------------------
  # Policy: disallow-root-user / rule: require-non-root-user
  # -----------------------------------------------------------------------
  - policy: disallow-root-user
    rule: require-non-root-user
    resources: [pod-pass-hardened]
    kind: Pod
    result: pass

  - policy: disallow-root-user
    rule: require-non-root-user
    resources: [pod-fail-runasroot]
    kind: Pod
    result: fail

  - policy: disallow-root-user
    rule: require-non-root-user
    resources: [pod-fail-runasnonroot-false]
    kind: Pod
    result: fail

  # -----------------------------------------------------------------------
  # Policy: disallow-root-user / rule: disallow-privilege-escalation
  # -----------------------------------------------------------------------
  - policy: disallow-root-user
    rule: disallow-privilege-escalation
    resources: [pod-pass-hardened]
    kind: Pod
    result: pass

  - policy: disallow-root-user
    rule: disallow-privilege-escalation
    resources: [pod-fail-privilege-escalation]
    kind: Pod
    result: fail

  # -----------------------------------------------------------------------
  # Policy: disallow-privileged-containers / rule: deny-privileged
  # -----------------------------------------------------------------------
  - policy: disallow-privileged-containers
    rule: deny-privileged
    resources: [pod-pass-hardened]
    kind: Pod
    result: pass

  - policy: disallow-privileged-containers
    rule: deny-privileged
    resources: [pod-fail-privileged]
    kind: Pod
    result: fail

  # -----------------------------------------------------------------------
  # Policy: disallow-privileged-containers / rule: require-drop-all-capabilities
  # -----------------------------------------------------------------------
  - policy: disallow-privileged-containers
    rule: require-drop-all-capabilities
    resources: [pod-pass-hardened]
    kind: Pod
    result: pass

  - policy: disallow-privileged-containers
    rule: require-drop-all-capabilities
    resources: [pod-fail-no-caps-drop]
    kind: Pod
    result: fail

  # -----------------------------------------------------------------------
  # Policy: disallow-privileged-containers / rule: deny-host-namespaces
  # -----------------------------------------------------------------------
  - policy: disallow-privileged-containers
    rule: deny-host-namespaces
    resources: [pod-pass-hardened]
    kind: Pod
    result: pass

  - policy: disallow-privileged-containers
    rule: deny-host-namespaces
    resources: [pod-fail-hostpid]
    kind: Pod
    result: fail

  - policy: disallow-privileged-containers
    rule: deny-host-namespaces
    resources: [pod-fail-hostipc]
    kind: Pod
    result: fail

  - policy: disallow-privileged-containers
    rule: deny-host-namespaces
    resources: [pod-fail-hostnetwork]
    kind: Pod
    result: fail
