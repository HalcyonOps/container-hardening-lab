# Explicitly sets runAsUser: 0 — must be denied by disallow-root-user.
apiVersion: v1
kind: Pod
metadata:
  name: pod-fail-runasroot
  namespace: default
spec:
  containers:
    - name: app
      image: python:3.12-slim
      securityContext:
        runAsUser: 0
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
