# Sets hostNetwork: true — must be denied by deny-host-namespaces.
apiVersion: v1
kind: Pod
metadata:
  name: pod-fail-hostnetwork
  namespace: default
spec:
  hostNetwork: true
  containers:
    - name: app
      image: python:3.12-slim
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        allowPrivilegeEscalation: false
        privileged: false
        capabilities:
          drop: ["ALL"]
