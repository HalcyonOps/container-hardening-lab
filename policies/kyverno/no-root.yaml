# policies/kyverno/no-root.yaml
# Enforce that Pods do not run containers as root.
#
# Apply to a cluster:
#   kubectl apply -f policies/kyverno/no-root.yaml
#
# CIS Kubernetes Benchmark: 5.2.6
# CIS Docker Benchmark: 4.1
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-root-user
  annotations:
    policies.kyverno.io/title: Disallow Root User
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers must not run as root (UID 0). This policy validates that
      no container in a Pod sets runAsUser: 0 or runAsNonRoot: false.
      It also blocks allowPrivilegeEscalation: true.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    # -------------------------------------------------------------------------
    # Rule 1: deny runAsUser: 0 or runAsNonRoot: false in any container
    # Uses top-level validate.deny with JMESPath array projections so that
    # kyverno test evaluates it correctly (foreach.deny is not tested by CLI).
    # -------------------------------------------------------------------------
    - name: require-non-root-user
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: >-
          CIS 4.1 / PSS Restricted: Containers must not run as root.
          Remove runAsUser: 0 and do not set runAsNonRoot: false.
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.containers[].securityContext.runAsUser }}"
                operator: AnyIn
                value:
                  - 0
              - key: "{{ request.object.spec.containers[].securityContext.runAsNonRoot }}"
                operator: AnyIn
                value:
                  - false

    # -------------------------------------------------------------------------
    # Rule 2: deny allowPrivilegeEscalation: true in any container
    # -------------------------------------------------------------------------
    - name: disallow-privilege-escalation
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: >-
          CIS 5.4: allowPrivilegeEscalation must be set to false.
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.containers[].securityContext.allowPrivilegeEscalation }}"
                operator: AnyIn
                value:
                  - true
