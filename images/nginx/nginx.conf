# Hardened nginx configuration
# References: CIS Nginx Benchmark, OWASP Secure Headers Project
#
# Key hardening decisions in this file:
#   - server_tokens off       — hide version disclosure
#   - port 8080               — avoid CAP_NET_BIND_SERVICE
#   - security response headers — defence-in-depth for browser clients
#   - hidden file denial      — block .git, .env, .htaccess exposure
#   - /healthz with no logging — clean orchestrator health checks

# Run worker processes as the nginx user (matches USER in Dockerfile).
# The master process also runs as nginx because we bind to port 8080 —
# if we were binding to port 80, the master would need to start as root
# to bind the privileged port, then drop to nginx for workers.
user  nginx;

# auto = one worker per CPU core. Adjust for I/O-bound vs CPU-bound workloads.
worker_processes  auto;

# Write PID to a path owned by the nginx user (set in Dockerfile).
# The default /var/run/nginx.pid requires root; this path is pre-created
# with nginx ownership so the process can manage its own PID file.
pid  /var/run/nginx.pid;

# warn level: logs errors and warnings, suppresses informational noise.
# Change to notice or info if debugging startup or configuration issues.
error_log  /var/log/nginx/error.log warn;

events {
    # Maximum simultaneous connections per worker.
    # Total capacity = worker_processes * worker_connections.
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # server_tokens off — CIS Nginx 2.4.1
    # -------------------------------------------------------------------------
    # By default, nginx includes its version number in:
    #   - The Server response header:  Server: nginx/1.27.0
    #   - HTML error pages:            nginx/1.27.0
    #
    # Version disclosure helps attackers target known CVEs without needing to
    # probe for vulnerabilities. Disabling it removes that signal.
    # Note: the Server header still says "nginx" — full suppression requires
    # a custom build with --with-http_headers_module or a third-party module.
    server_tokens off;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # =========================================================================
    # Security response headers — applied to all responses globally
    #
    # `always` ensures headers are sent even on error responses (4xx, 5xx).
    # Without `always`, nginx omits these headers from error pages, which are
    # often the responses most likely to contain reflected content.
    # =========================================================================

    # -------------------------------------------------------------------------
    # X-Frame-Options: SAMEORIGIN — clickjacking protection
    # -------------------------------------------------------------------------
    # Prevents this page from being embedded in an <iframe> on a different
    # origin. Clickjacking attacks overlay a transparent iframe over a decoy
    # page to trick users into clicking UI elements they cannot see.
    # SAMEORIGIN allows framing from the same origin (useful for SPAs with
    # internal iframes). Use DENY to block all framing.
    add_header X-Frame-Options           "SAMEORIGIN"           always;

    # -------------------------------------------------------------------------
    # X-Content-Type-Options: nosniff — MIME sniffing protection
    # -------------------------------------------------------------------------
    # Prevents browsers from "sniffing" the content type of a response and
    # overriding the declared Content-Type. Without this, a browser might
    # interpret a text/plain response containing HTML as text/html and execute
    # scripts within it — a common vector for cross-site scripting via
    # file upload endpoints.
    add_header X-Content-Type-Options    "nosniff"              always;

    # -------------------------------------------------------------------------
    # X-XSS-Protection: 1; mode=block — legacy XSS filter
    # -------------------------------------------------------------------------
    # Activates the built-in XSS auditor in older browsers (IE, pre-2019
    # Chrome and Safari). Modern browsers have deprecated this header in
    # favour of Content-Security-Policy. Included for backward compatibility
    # with clients that don't support CSP.
    add_header X-XSS-Protection          "1; mode=block"        always;

    # -------------------------------------------------------------------------
    # Referrer-Policy: strict-origin-when-cross-origin — referrer control
    # -------------------------------------------------------------------------
    # Controls what is sent in the Referer header when navigating between pages.
    # strict-origin-when-cross-origin:
    #   - Same-origin requests: full URL (origin + path + query)
    #   - Cross-origin HTTPS → HTTPS: origin only (no path or query string)
    #   - Cross-origin HTTPS → HTTP: no Referer header sent
    #
    # Prevents leaking URL paths and query parameters (which may contain
    # session tokens, search terms, or internal resource identifiers) to
    # third-party origins.
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # Permissions-Policy — browser feature gating
    # -------------------------------------------------------------------------
    # Formerly Feature-Policy. Explicitly disables browser APIs that this
    # application does not use. An attacker who achieves XSS cannot request
    # geolocation, microphone, or camera access even if the user would
    # normally grant it — the policy blocks the API at the browser level.
    # Extend this list with any other APIs your application doesn't need:
    # payment=(), usb=(), fullscreen=(), accelerometer=()
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # -------------------------------------------------------------------------
    # Content-Security-Policy — XSS and injection defence
    # -------------------------------------------------------------------------
    # Defines which sources the browser may load scripts, styles, fonts,
    # images, and other resources from. A violation is blocked and optionally
    # reported.
    #
    # default-src 'self'     — all resource types default to same-origin only
    # script-src 'self'      — no inline scripts, no eval(), no CDN scripts
    # object-src 'none'      — block Flash, Java applets, and other plugins
    #
    # This is a strict baseline. Relax specific directives as needed:
    #   style-src 'self' 'unsafe-inline'  — if your CSS framework uses inline styles
    #   img-src 'self' data:              — if you use base64-encoded images
    #   connect-src 'self' https://api.example.com  — if you call external APIs
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; object-src 'none';" always;

    # -------------------------------------------------------------------------
    # Strict-Transport-Security (HSTS) — force HTTPS
    # -------------------------------------------------------------------------
    # Instructs browsers to always use HTTPS for this domain for the next
    # max-age seconds (31536000 = 1 year). After the first HTTPS visit,
    # the browser will refuse to connect over HTTP — even if the user types
    # "http://" or follows an http:// link.
    #
    # WARNING: Only activate this header when the service is running behind
    # a TLS-terminating load balancer or ingress controller. Sending HSTS
    # over plain HTTP has no security value and can cause access issues.
    # includeSubDomains extends the policy to all subdomains.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server {
        # Bind to port 8080 — non-privileged, no CAP_NET_BIND_SERVICE needed.
        # Port mapping (80 → 8080) is handled at the ingress/load balancer layer.
        listen 8080;

        # _ matches any Host header. In production, replace with your domain:
        # server_name example.com www.example.com;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # -------------------------------------------------------------------------
        # /healthz — orchestrator health check endpoint
        # -------------------------------------------------------------------------
        # Returns 200 OK for liveness/readiness probes. access_log off prevents
        # probe traffic from flooding access logs (probes may run every few seconds).
        # The HEALTHCHECK in the Dockerfile uses `nc -z 127.0.0.1 8080` rather than
        # hitting /healthz directly, but this location is available for Kubernetes
        # httpGet probes which do inspect the response.
        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # -------------------------------------------------------------------------
        # Hidden file denial — block exposure of .git, .env, .htaccess, etc.
        # -------------------------------------------------------------------------
        # Any request for a path beginning with a dot is denied and returns 404
        # (not 403 — 404 avoids confirming that the path exists).
        # This prevents accidental exposure of:
        #   /.git/config        — repository metadata and remote URLs
        #   /.env               — environment variable files with credentials
        #   /.htaccess          — Apache config files sometimes copied with assets
        #   /.DS_Store          — macOS directory metadata
        location ~ /\. {
            deny all;
            return 404;
        }

        # -------------------------------------------------------------------------
        # SPA fallback — serve index.html for all unmatched routes
        # -------------------------------------------------------------------------
        # try_files checks for an exact file match ($uri), then a directory
        # index ($uri/), then falls back to index.html. This allows client-side
        # routers (React Router, Vue Router, etc.) to handle their own routes
        # without nginx returning 404 on a hard refresh.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
