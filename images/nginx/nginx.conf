# Hardened nginx configuration
# References: CIS Nginx Benchmark, OWASP Secure Headers Project

# Run as non-privileged user (matches USER directive in Dockerfile)
user  nginx;
worker_processes  auto;

# Write PID to location writable by nginx user
pid  /var/run/nginx.pid;

error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Hide nginx version in headers and error pages ---
    server_tokens off;

    # --- Logging ---
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # --- Security headers applied globally ---
    add_header X-Frame-Options           "SAMEORIGIN"           always;
    add_header X-Content-Type-Options    "nosniff"              always;
    add_header X-XSS-Protection          "1; mode=block"        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; object-src 'none';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server {
        # Bind to non-privileged port (running as nginx user, not root)
        listen 8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Health check endpoint — no logging to keep logs clean
        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Deny access to hidden files (e.g. .git, .env)
        location ~ /\. {
            deny all;
            return 404;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
